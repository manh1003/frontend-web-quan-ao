spring.application.name=demowebbanquanao

spring.datasource.url=jdbc:mysql://localhost:3306/fashion_store?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=tranluan
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL scripts
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JPA settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8

# Force UTF-8 for web responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration (minimum 512 bits = 64 characters for HS512)
jwt.secret=your-super-secret-jwt-key-must-be-at-least-512-bits-64-characters-long-for-hs512-algorithm-to-work-securely
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File Upload Configuration
app.upload.dir=uploads
app.base.url=http://localhost:8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
